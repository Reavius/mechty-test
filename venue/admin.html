<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Админка — «Мечты»</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/venue.css">
<style>
  .adm{max-width:920px;margin:0 auto;padding:22px 16px 80px}
  .admh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .admh h1{font-family:var(--display);font-size:38px;margin:0;line-height:1}
  .atabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none}
  .atabs::-webkit-scrollbar{display:none}
  .atabs .chip{white-space:nowrap}
  .atabs .chip i{font-style:normal;margin-left:6px;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:11px}
  .ali{padding:14px 16px;margin-bottom:10px;display:grid;gap:6px}
  .ali .at{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .ali .at b{font-size:16px}
  .ali .am{color:var(--muted);font-size:13.5px}
  .ali .ab{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
  .st{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
  .st.new,.st.paid{background:rgba(201,162,75,.16);color:var(--accent)}
  .st.ok{background:rgba(123,196,127,.14);color:var(--ok)}
  .st.no{background:rgba(229,88,79,.14);color:var(--red)}
  .st.call{background:rgba(138,124,240,.16);color:#B3A9FF}
  .af{padding:16px;margin-bottom:14px}
  .af .fl:first-child{margin-top:0}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .thumbs span{position:relative}
  .thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;font-size:14px;line-height:1}
  .abtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .abtns .del{margin-left:auto;color:var(--red)}
  .hrow{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:8px}
  .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
  .hid{opacity:.55}
  .login{max-width:380px;margin:12vh auto 0;padding:24px}
</style>
</head>
<body>
<div class="demo">Пример админки: изменения сразу видны на сайте. Данные — в папке venue/data на этом компьютере.</div>
<div id="app"></div>
<script src="/admin.js" defer></script>
</body>
</html>
