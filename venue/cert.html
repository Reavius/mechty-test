<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Подарочный сертификат — «Мечты»</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/venue.css">
<style>
  .cbig{aspect-ratio:16/10;max-width:640px;border-radius:22px;padding:26px;display:grid;grid-template-columns:1fr auto;gap:18px;align-content:space-between;
    background:linear-gradient(135deg,#2B2416 0%,#14161B 55%,#2A1F33 100%);border:1px solid #3A3222;position:relative;overflow:hidden}
  .cbig .ck{grid-column:1/-1;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .cbig .cs{font-family:var(--display);font-size:clamp(40px,10vw,84px);font-weight:600;line-height:.95;white-space:nowrap}
  .cbig .cw{color:#D9D6CF;font-size:15px;margin-top:6px}
  .cbig .qr{background:#fff;border-radius:12px;padding:8px;align-self:end;width:120px;height:120px}
  .cbig .qr img{width:100%;height:100%}
  .cbig .cc{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .cbig .cc b{color:var(--fg);letter-spacing:.08em}
  .used{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:8px;background:rgba(229,88,79,.15);color:var(--red);font-weight:800}
  @media print{.cbig{border:1px solid #999;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="demo noprint">Пример: оплата не настоящая — в рабочей версии здесь платёжная страница банка.</div>
<main class="page">
  <p class="kick noprint"><a href="/">← «Мечты»</a></p>
  <h1 class="noprint">Ваш сертификат</h1>
  <div id="out"><p class="empty">Загружаем…</p></div>
  <div class="noprint" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
    <button type="button" class="btn" onclick="print()">Распечатать</button>
    <button type="button" class="btn ghost" id="share">Отправить получателю</button>
  </div>
  <p class="sub noprint" style="margin-top:14px">Сертификат действует до даты на нём. На месте покажите QR-код или назовите код — администратор отметит его как использованный.</p>
</main>
<script src="/vendor/qrcode.js"></script>
<script>
"use strict";
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const day = s => { const d = new Date(s + "T12:00:00Z"); return d.getUTCDate() + " " + MON[d.getUTCMonth()] + " " + d.getUTCFullYear(); };
const rub = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₽";
(async () => {
  const code = decodeURIComponent(location.hash.slice(1)), out = document.getElementById("out");
  if (!/^M-[0-9A-F]{6}-[0-9A-F]{4}$/.test(code)){ out.innerHTML = '<p class="empty">Нет кода сертификата в ссылке.</p>'; return; }
  const r = await fetch("/api/cert/" + code).then(x => x.json()).catch(() => ({error: "Нет связи."}));
  if (!r.ok){ out.innerHTML = '<p class="empty">' + esc(r.error || "Сертификат не найден.") + '</p>'; return; }
  const c = r.cert, q = qrcode(0, "M"); q.addData(location.origin + "/cert.html#" + c.code); q.make();
  out.innerHTML = '<div class="cbig"><span class="ck">Подарочный сертификат · «' + esc(r.info.name) + '»</span>' +
    '<div><div class="cs">' + rub(c.sum) + '</div><div class="cw">' + (c.to ? "Для: " + esc(c.to) : "Подарок") + (c.from ? " · от " + esc(c.from) : "") + '</div>' +
    (c.wish ? '<div class="cw">«' + esc(c.wish) + '»</div>' : "") + '</div><div class="qr"><img alt="QR-код сертификата" src="' + q.createDataURL(4, 0) + '"></div>' +
    '<div class="cc"><span>Код <b>' + esc(c.code) + '</b></span><span>до ' + esc(day(c.till)) + '</span><span>' + esc(r.info.address) + " · " + esc(r.info.phone) + '</span></div></div>' +
    (c.used ? '<span class="used">Использован</span>' : "");
  document.getElementById("share").onclick = async () => {
    const url = location.href;
    if (navigator.share) { try { await navigator.share({title: "Подарочный сертификат", url}); } catch (e) {} return; }
    try { await navigator.clipboard.writeText(url); document.getElementById("share").textContent = "Ссылка скопирована"; } catch (e) { prompt("Ссылка на сертификат", url); }
  };
})();
</script>
</body>
</html>
